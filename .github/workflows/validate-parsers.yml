name: Validate parsers

on:
  push:
    branches:
      - develop
permissions:
  contents: read

jobs:
  generated-samples:
    name: Generated parser samples
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true

      - name: Install sample generators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nmap
          go install github.com/ffuf/ffuf/v2@latest
          go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          go install github.com/OJ/gobuster/v3@latest
          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run tests
        run: go test ./...

      - name: Validate generated parser samples
        run: scripts/validate-generated-samples.sh
